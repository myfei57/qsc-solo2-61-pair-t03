<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Environment</title>
<style>
body { font-family: system-ui, sans-serif; margin: 2rem; color: #1b1f24; }
nav a { margin-right: 1rem; color: #0b5fff; text-decoration: none; }
table { border-collapse: collapse; margin-top: 1rem; }
th, td { border: 1px solid #d0d7de; padding: 0.4rem 0.75rem; text-align: left; }
th { background: #f6f8fa; }
</style>
</head>
<body>
<nav><a href="/cabins">Cabins</a><a href="/env">Environment</a><a href="/patrols">Patrols</a><a href="/alarms">Alarms</a></nav>
<h1>Environment</h1>
<p>Sensor readings, alarm counts and the partition each sensor reports to.</p>
<table>
<thead><tr><th>Sensor</th><th>Partition</th><th>Latest</th><th>Readings</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<p id="alarms"></p>
<h2>告警处置（与消防、电缆、控制台同源）</h2>
<p id="disposition"></p>
<table>
<thead><tr><th>告警</th><th>状态</th><th>升级级别</th><th>责任人</th><th>重复次数</th></tr></thead>
<tbody id="disposition-rows"></tbody>
</table>
<script>
async function load() {
  const response = await fetch("/api/env/sensors");
  const data = await response.json();
  document.getElementById("rows").innerHTML = Object.entries(data.snapshot.sensors).map(([id, item]) =>
    `<tr><td>${id}</td><td>${item.partition}</td><td>${item.latest}</td><td>${item.count}</td></tr>`).join("");
  document.getElementById("alarms").textContent = `Alarms: ${data.snapshot.alarms}`;

  const overview = await (await fetch("/api/env")).json();
  const d = overview.disposition;
  document.getElementById("disposition").textContent =
    `打开 ${d.open}（待确认 ${d.pending} / 处理中 ${d.processing} / 挂起 ${d.suspended}），已关闭 ${d.closed}`;
  const levelName = {1: "值班员", 2: "班组长", 3: "值班经理", 4: "值班总监"};
  document.getElementById("disposition-rows").innerHTML = (overview.dispositions || []).map((alarm) =>
    `<tr><td><a href="/alarms">${alarm.id}</a></td><td>${alarm.state}</td>` +
    `<td>${levelName[alarm.level] || alarm.level}</td><td>${alarm.assignee || "—"}</td>` +
    `<td>${alarm.occurrence_count}</td></tr>`).join("");
}
load();
</script>
</body>
</html>
